[package]
name = "dsh-launcher"
version = "1.3.0"
edition = "2021"
# Windows 10 / 11 (64-bit). MSRV comes from `Option::is_none_or` (Rust 1.82).
rust-version = "1.82"
description = "One-click launcher for DeepSeek Harness: starts the DSH web UI with no console window, opens one clean Chrome window, and stops the service when that window closes. Survives DSH updates via an editable config file."
license = "MIT"
readme = "README.md"
repository = "https://github.com/zhubingzuo/dsh-oneclick-launcher"
keywords = ["deepseek", "harness", "dsh", "launcher", "windows"]
categories = ["command-line-utilities"]
build = "build.rs"

# Intentionally zero external dependencies: the sandbox/offline environment
# cannot download crates, and the Win32 surface we need is tiny.

[profile.release]
opt-level = "s"
lto = true
strip = true
